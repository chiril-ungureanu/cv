# About Section
about_title: About Me
# about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Highly skilled and certified Drupal Backend Developer with 7 years of experience in creating, scaling, and maintaining robust online solutions for high-profile projects. Proficient in PHP backend development, Acquia Drupal Cloud, site architecture, and backend integrations, with a strong emphasis on secure, maintainable code. Known for delivering complex Drupal implementations, API and microservice integrations, and optimizing backend workflows. A dedicated technical leader, consistently bridging project management with development teams to ensure seamless project execution.

content:

  - title: Skills # Title for the section
    layout: text # Type of content section (list/text)
    content: |
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-12">
            <h4>Drupal & CMS Development</h4>
            <ul>
              <li>Drupal 8, 9, 10: Custom module development, Custom Entity, Paragraphs, Drupal Commerce, and Views.</li>
              <li>Multilingual Site Setup and Management..</li>
              <li>Site architecture planning, Entity API, and Field API.</li>
              <li>Extensive experience with Composer and Git for efficient dependency management and version control.</li>
            </ul>
            <h4>DevOps & Cloud Platforms</h4>
            <ul>
              <li>Acquia Drupal Cloud: Cloud management, application hosting, and resource optimization.</li>
              <li>Docker: Containerization, orchestration, and environment setup for isolated, scalable development.</li>
              <li>CI/CD: CircleCI, Bitbucket pipelines for automated build, test, and deployment pipelines.</li>
              <li>Familiarity with Pantheon, Proxmox, Digital Ocean, Linode including CI/CD integration for multi-environment workflows.</li>
            </ul>
            <h4>Backend Integration & API Development</h4>
            <ul>
              <li>RESTful APIs, GraphQL, JSON for efficient data exchange between services.</li>
              <li>Integrating and managing third-party APIs (Twilio, Victoriabank, OneTrust, Chartbeat).</li>
              <li>Data migration strategies: Structured migration from NoSQL to SQL and legacy systems to Drupal.</li>
            </ul>
            <h4>Backend & Frontend Technologies</h4>
            <ul>
              <li>PHP 7-8, JavaScript (ES6+), NodeJS, React, NextJS.</li>
              <li>Knowledge of decoupled/Headless Drupal and React/Vue for frontend integration.</li>
              <li>Data migration strategies: Structured migration from NoSQL to SQL and legacy systems to Drupal.</li>
            </ul>
            <h4>Project Management & Collaboration</h4>
            <ul>
              <li>Agile methodologies: Scrum, Kanban, and JIRA for transparent, iterative development cycles.</li>
              <li>Strong written and verbal communication skills for effective remote coordination.</li>
              <li>Team leadership experience with code review, mentoring, and technical guidance.</li>
            </ul>
          </div>
        </div>
      </div>

  - title: Certification # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Acquia Certification Program
        description: | # this will include new lines to allow paragraphs
          - Triple Certified Drupal Expert - Drupal 10 - 2023
          - Acquia Certified Back End Specialist - Drupal 10 - 2023
          - Acquia Certified Developer - Drupal 10 - 2023
          - Acquia Certified Front End Specialist - Drupal 10 - 2023    

  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Ecofinance (CreditPrime)
        sub_title: Backend Developer
        caption: February 2025 - Present
        description: |
          - **Product Development:** Building and maintaining backend features for a fintech credit/loan platform, developing custom PHP modules and services for core business logic in a fully backend role.
          - **Microservice & API Integration:** Designed and integrated microservices and third-party APIs, enabling reliable data exchange across financial services and external providers.
          - **Architecture & Performance:** Improved system architecture and application performance through code optimization, refactoring, and clean backend engineering practices.

      - layout: left
        title: Jakala (FFW Agency)
        sub_title: Drupal Developer
        caption: May 2021 - February 2025
        description: |
          - **Custom Development:** Designed and developed robust, reusable custom modules to extend Drupal core and meet complex, project-specific requirements. Created GraphQL endpoints and custom entities to optimize data retrieval, enhancing site speed and performance.
          - **Technical Leadership:** Acted as the lead developer in multi-market, multilingual projects, liaising between project management and technical teams. Ensured timely delivery by providing architectural guidance and setting technical standards for the team.
          - **Deployment & CI/CD:** Managed Acquia-hosted applications and created CI/CD workflows. Streamlined deployment scripts for consistent environment setup across development, staging, and production.
          - **Quality Assurance:** Conducted rigorous code reviews and led debugging efforts to maintain high-quality code and ensure bug-free, scalable solutions.

      - layout: left
        title: Indrivo
        sub_title: Drupal Developer
        caption: May 2019 - May 2021
        description: |
          - **Drupal Commerce Development:** Extended Drupal Commerce functionalities with custom payment modules (Victoriabank, Moldova-Agroinbank), providing clients with integrated, secure payment solutions.
          - **API Integration & Data Migration:** Developed REST APIs to synchronize marketplace data with external vendors, ensuring up-to-date inventory and pricing. Oversaw the migration of legacy data from NoSQL systems to structured SQL databases, optimizing for performance and data integrity.
          - **Enhanced Site Functionality:** Customized Drupal core and contributed modules, including custom Views filters, entity tokens, and responsive themes. Integrated multilingual support for regional content accessibility.
          - **DevOps & Automation:** Set up Dockerized development environments, streamlined workflows, and implemented CI/CD with CircleCI to automate builds and deployments.

  - title: Projects
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Penn State University
        description: |
          - Integrated dynamic React components within Next.js, improving frontend interactivity and usability.
          - Managed complex data migrations to Contentful, reducing manual content handling and enhancing CMS efficiency.

      - layout: left
        title: Superbook
        description: |
          - Designed efficient GraphQL endpoints and custom Drupal entities for optimized data structuring.
          - Implemented Storybook-integrated Drupal Paragraphs, creating a consistent design system across components.

      - layout: left
        title: Baker Institute
        description: |
          - Migrated content from legacy NoSQL to a SQL-based Drupal 9 site, enhancing data reliability and scalability.
          - Developed custom filters and Views listings for more intuitive, content-rich pages.

      - layout: left
        title: NBC Sports Regional Networks
        description: |
          - Improved AMP support for fast, mobile-friendly content. Integrated with OneTrust and Chartbeat for regulatory compliance and analytics, enhancing site functionality.
  
      - layout: left
        title: Selia.md Marketplace
        description: |
          - Built a REST API for real-time data synchronization, allowing marketplace and seller integration.
          - Developed custom modules to handle inventory and pricing data, ensuring a smooth, reliable marketplace experience.

