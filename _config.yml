# About Section
about_title: Professional Summary
# about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Backend-focused PHP developer with 7+ years of experience in fintech and enterprise web development. Currently working on a microcredit platform across PHP 8 services, a Symfony-based BFF, and a mature legacy PHP application undergoing gradual modernization.
  
  Experienced in API development, third-party integrations, asynchronous and batch processing, performance optimization, SQL-based data investigation, and automated testing with PHPUnit. Previously specialized in large-scale Drupal platforms, including custom backend development, APIs, migrations, and integrations.
  
  Based in Chisinau, Moldova with EU work authorization.

content:

  - title: Skills # Title for the section
    layout: text # Type of content section (list/text)
    content: |
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-12">
            <h4>PHP Ecosystem</h4>
            <ul>
              <li>PHP 8, object-oriented programming, legacy PHP modernization, refactoring, debugging, performance optimization.</li>
              <li>Symfony, Drupal 8/9/10, Drupal Commerce, Composer, Git.</li>
            </ul>
            <h4>Architecture & APIs</h4>
            <ul>
              <li>REST APIs, GraphQL, JSON:API, Backend-for-Frontend (BFF), third-party integrations.</li>
              <li>Data migration, legacy modernization, service integration.</li>
            </ul>
            <h4>Infrastructure</h4>
            <ul>
              <li>Docker, Acquia Cloud.</li>
              <li>CI/CD: CircleCI, Bitbucket Pipelines.</li>
            </ul>
            <h4>Databases & Data</h4>
            <ul>
              <li>PostgreSQL, MySQL, SQL query writing, reporting, data investigation.</li>
            </ul>
            <h4>Third-party Integrations</h4>
            <ul>
              <li>Maestra, AppsFlyer, Victoriabank, Moldova-Agroindbank, OneTrust.</li>
            </ul>
            <h4>Testing</h4>
            <ul>
              <li>PHPUnit, automated testing, regression testing.</li>
            </ul>
            <h4>Frontend Integration</h4>
            <ul>
              <li>JavaScript, jQuery, React, Twig.</li>
            </ul>
            <h4>Process</h4>
            <ul>
              <li>Queues, background processing, batch jobs, parallel processing, technical analysis, task estimation.</li>
            </ul>
          </div>
        </div>
      </div>

  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Ecofinance - CreditPrime
        sub_title: Backend Developer
        caption: February 2025 - Present
        description: |
          Contribute to the development and modernization of a microcredit platform built across legacy PHP, PHP 8 services, and a Symfony-based BFF, while supporting the gradual migration from PHP 5.3 to PHP 8.
          
          - Build Symfony BFF endpoints, including DTOs, request validation, service integration, and automated tests using PHPUnit.
          - Maintain and extend a standalone PHP 8 microservice supporting loan processing functionality.
          - Implemented integrations with Maestra and AppsFlyer to support customer communication, engagement, and attribution workflows.
          - Redesigned a queue-processing workflow using separate fast and rescue lanes, reducing the daily event-processing window by more than 50%.
          - Refactored and parallelized monthly reporting scripts, reducing execution time from approximately eight hours to under two hours.
          - Prepare PostgreSQL queries and SQL scripts for repositories, data investigations, reporting, and controlled production execution by operations teams.
          - Investigate production issues across legacy and modern application components and implement stable fixes.

      - layout: left
        title: Jakala (FFW Agency)
        sub_title: Drupal Developer
        caption: May 2021 - February 2025
        description: |
          Worked on enterprise Drupal platforms with a strong backend focus, including custom business logic, API integrations, migrations, CI/CD, debugging, and performance optimization.

          - Built and maintained custom PHP modules and backend functionality for Drupal 9 and Drupal 10 platforms.
          - Implemented GraphQL, REST, and third-party integrations to support content delivery, compliance, analytics, and external system communication.
          - Investigated and fixed backend defects in production systems while preserving platform stability.
          - Contributed to deployment workflows and CI/CD automation for client projects.

      - layout: left
        title: Indrivo
        sub_title: Drupal Developer
        caption: May 2019 - May 2021
        description: |
          Built custom backend functionality for Drupal Commerce and content platforms, with a focus on integrations, business workflows, and third-party API integrations.

          - Developed custom Drupal modules to extend e-commerce and marketplace functionality.
          - Integrated third-party services and payment systems into Drupal-based platforms.
          - Built and maintained backend flows for reservations, authentication, and seller synchronization.
          - Investigated and resolved application issues through debugging and testing.

  - title: Selected Projects
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Superbook
        description: |
          - Designed and implemented GraphQL endpoints for custom entities and application data access.
          - Built custom entities and supporting backend logic for project-specific data modeling.
          - Developed custom editor functionality and content-processing filters for automated Bible reference handling.
  
      - layout: left
        title: NBC Sports Regional Networks
        description: |
          - Implemented integrations and backend changes supporting compliance, content distribution, and platform maintenance.
          - Improved Apple News and AMP-related functionality and resolved backend defects in an actively maintained production platform.
  
      - layout: left
        title: Selia.md Marketplace
        description: |
          - Built a REST API for real-time data synchronization, allowing marketplace and seller integration.
          - Developed custom modules to handle inventory and pricing data, ensuring a smooth, reliable marketplace experience.

